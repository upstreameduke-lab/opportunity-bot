name: Daily Opportunity Digest

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Run Opportunity Bot
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python opportunity_bot.py

      - name: Commit updated database
        run: |
          git config --global user.name "OpportunityBot"
          git config --global user.email "bot@github.com"
          git add opportunities.db || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen opportunities database [skip ci]" && git push)
